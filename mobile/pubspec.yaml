name: creatorpilot_ai
description: "CreatorPilot AI — One Idea. Complete Content."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3
  retrofit: ^4.1.0
  json_annotation: ^4.9.0

  # Firebase (auth + storage metadata only — no AI keys ever live here)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.1
  firebase_app_check: ^0.3.0

  # Billing
  in_app_purchase: ^3.2.0

  # Local
  shared_preferences: ^2.2.3
  freezed_annotation: ^2.4.1

  # UI / UX
  cached_network_image: ^3.3.1
  video_player: ^2.9.1
  share_plus: ^9.0.0
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  retrofit_generator: ^9.1.0
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
